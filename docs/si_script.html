<!-- Reading progress bar -->
<div class="reading-progress" id="readingProgress"></div>

<!-- Lightbox overlay -->
<div class="lightbox-overlay" id="lightbox">
  <button class="lightbox-close" aria-label="Close">&times;</button>
  <img src="" alt="" />
  <span class="lightbox-hint">Click anywhere or press Esc to close</span>
</div>

<!-- Back to top button -->
<button class="back-to-top" id="backToTop" aria-label="Back to top">&#8593;</button>

<script>
document.addEventListener('DOMContentLoaded', function() {

  // --- Reading Progress Bar ---
  const progressBar = document.getElementById('readingProgress');
  function updateProgress() {
    const scrollTop = window.scrollY;
    const docHeight = document.documentElement.scrollHeight - window.innerHeight;
    const progress = docHeight > 0 ? (scrollTop / docHeight) * 100 : 0;
    progressBar.style.width = progress + '%';
  }

  // --- Back-to-Top Button ---
  const backToTop = document.getElementById('backToTop');
  function updateBackToTop() {
    if (window.scrollY > 500) {
      backToTop.classList.add('visible');
    } else {
      backToTop.classList.remove('visible');
    }
  }
  backToTop.addEventListener('click', function() {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  // Combined scroll handler (throttled)
  let ticking = false;
  window.addEventListener('scroll', function() {
    if (!ticking) {
      window.requestAnimationFrame(function() {
        updateProgress();
        updateBackToTop();
        ticking = false;
      });
      ticking = true;
    }
  });

  // --- Figure Lightbox ---
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = lightbox.querySelector('img');
  const lightboxClose = lightbox.querySelector('.lightbox-close');

  // Target all figure images
  document.querySelectorAll('.figure img, div.figure img, p > img').forEach(function(img) {
    img.addEventListener('click', function(e) {
      e.stopPropagation();
      lightboxImg.src = this.src;
      lightboxImg.alt = this.alt || 'Figure';
      lightbox.classList.add('active');
      document.body.style.overflow = 'hidden';
    });
  });

  function closeLightbox() {
    lightbox.classList.remove('active');
    document.body.style.overflow = '';
  }

  lightbox.addEventListener('click', closeLightbox);
  lightboxClose.addEventListener('click', closeLightbox);
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && lightbox.classList.contains('active')) {
      closeLightbox();
    }
  });

  // --- Smooth highlight on TOC click ---
  document.querySelectorAll('#TOC a').forEach(function(link) {
    link.addEventListener('click', function(e) {
      const targetId = this.getAttribute('href');
      if (targetId && targetId.startsWith('#')) {
        const target = document.querySelector(targetId);
        if (target) {
          target.style.transition = 'background 0.5s ease';
          target.style.background = 'rgba(94, 176, 212, 0.08)';
          setTimeout(function() {
            target.style.background = '';
          }, 1500);
        }
      }
    });
  });

  // Initialize
  updateProgress();
  updateBackToTop();
});
</script>
