<script>
document.addEventListener('DOMContentLoaded', function() {

  /* ---- Build TOC from headings ---- */
  var headings = document.querySelectorAll('h1, h2, h3');
  if (headings.length > 0) {
    var nav = document.createElement('nav');
    nav.id = 'TOC';
    var ul = document.createElement('ul');
    var currentH1Li = null;
    var currentH2Li = null;
    var currentH1Ul = null;
    var currentH2Ul = null;

    headings.forEach(function(h) {
      // Skip the document title
      if (h.classList.contains('title')) return;

      // Ensure heading has an id
      if (!h.id) {
        var parent = h.parentElement;
        if (parent && parent.id) {
          h.id = parent.id;
        } else {
          h.id = h.textContent.trim().toLowerCase()
            .replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
        }
      }

      var li = document.createElement('li');
      var a = document.createElement('a');
      a.href = '#' + h.id;
      a.textContent = h.textContent.trim();
      li.appendChild(a);

      var level = parseInt(h.tagName.charAt(1));

      if (level === 1) {
        ul.appendChild(li);
        currentH1Li = li;
        currentH1Ul = null;
        currentH2Li = null;
        currentH2Ul = null;
      } else if (level === 2) {
        if (!currentH1Ul && currentH1Li) {
          currentH1Ul = document.createElement('ul');
          currentH1Li.appendChild(currentH1Ul);
        }
        (currentH1Ul || ul).appendChild(li);
        currentH2Li = li;
        currentH2Ul = null;
      } else if (level === 3) {
        if (!currentH2Ul && currentH2Li) {
          currentH2Ul = document.createElement('ul');
          currentH2Li.appendChild(currentH2Ul);
        }
        (currentH2Ul || currentH1Ul || ul).appendChild(li);
      }
    });

    nav.appendChild(ul);
    document.body.prepend(nav);
  }

  /* ---- Reading progress bar ---- */
  var progressContainer = document.createElement('div');
  progressContainer.id = 'reading-progress';
  var progressBar = document.createElement('div');
  progressBar.className = 'bar';
  progressContainer.appendChild(progressBar);
  document.body.prepend(progressContainer);

  function updateProgress() {
    var scrollTop = window.scrollY;
    var docHeight = document.documentElement.scrollHeight - window.innerHeight;
    var pct = docHeight > 0 ? (scrollTop / docHeight) * 100 : 0;
    progressBar.style.width = pct + '%';
  }

  /* ---- Scroll spy for TOC ---- */
  var tocLinks = document.querySelectorAll('nav#TOC a');
  var sections = [];

  tocLinks.forEach(function(link) {
    var href = link.getAttribute('href');
    if (href && href.startsWith('#')) {
      var target = document.getElementById(href.slice(1));
      if (target) {
        sections.push({ link: link, target: target });
      }
    }
  });

  function updateScrollSpy() {
    var scrollPos = window.scrollY + 120;
    var current = null;
    for (var i = 0; i < sections.length; i++) {
      if (sections[i].target.offsetTop <= scrollPos) {
        current = sections[i];
      }
    }

    tocLinks.forEach(function(l) { l.classList.remove('active'); });
    if (current) {
      current.link.classList.add('active');
      var toc = document.querySelector('nav#TOC');
      if (toc) {
        var linkRect = current.link.getBoundingClientRect();
        var tocRect = toc.getBoundingClientRect();
        if (linkRect.bottom > tocRect.bottom - 40 || linkRect.top < tocRect.top + 60) {
          current.link.scrollIntoView({ block: 'center', behavior: 'smooth' });
        }
      }
    }
  }

  /* ---- Back to top button ---- */
  var backBtn = document.createElement('button');
  backBtn.id = 'back-to-top';
  backBtn.textContent = '\u2191';
  backBtn.title = 'Back to top';
  document.body.appendChild(backBtn);

  backBtn.addEventListener('click', function() {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  function updateBackToTop() {
    if (window.scrollY > 500) {
      backBtn.classList.add('visible');
    } else {
      backBtn.classList.remove('visible');
    }
  }

  /* ---- Throttled scroll handler ---- */
  var ticking = false;
  window.addEventListener('scroll', function() {
    if (!ticking) {
      window.requestAnimationFrame(function() {
        updateProgress();
        updateScrollSpy();
        updateBackToTop();
        ticking = false;
      });
      ticking = true;
    }
  }, { passive: true });

  /* ---- Collapsible taxa-by-taxa sections ---- */
  var taxaSection = document.getElementById('taxa-by-taxa-details');
  if (taxaSection) {
    var level3Sections = taxaSection.querySelectorAll(':scope > div.section.level3');
    level3Sections.forEach(function(sec) {
      var h3 = sec.querySelector('h3');
      if (!h3) return;

      var details = document.createElement('details');
      details.className = 'collapsible-section';

      var summary = document.createElement('summary');
      summary.textContent = h3.textContent.trim();
      details.appendChild(summary);

      var contentDiv = document.createElement('div');
      contentDiv.className = 'section-content';

      // Move all children except h3 into content div
      var children = Array.from(sec.children);
      children.forEach(function(child) {
        if (child !== h3) {
          contentDiv.appendChild(child);
        }
      });

      details.appendChild(contentDiv);
      sec.replaceChild(details, h3);
    });
  }

  /* Initial calls */
  updateProgress();
  updateScrollSpy();
  updateBackToTop();
});
</script>
